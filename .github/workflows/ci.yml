name: CI Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      PORT: 4000
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/aidetector?schema=public"
      BETTER_AUTH_SECRET: "ci_deterministic_secret_key_at_least_32_characters_long"
      BETTER_AUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      SAPLING_API_KEY: "mock_ci_test_key"
      SAPLING_API_URL: "https://api.sapling.ai/api/v1/aidetect"
      SERVER_PEPPER_KEY: "ci_development_pepper_key_for_testing"
      HMAC_KEY_CURRENT_VERSION: "v1"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Shared Types
        run: pnpm --filter @ai-detector/shared-types run build

      - name: Generate Prisma Client
        run: pnpm --filter api run prisma:generate

      - name: Validate TypeScript Types
        run: pnpm --recursive run typecheck

      - name: Run Automated Unit Tests
        run: pnpm --filter api test

      - name: Compile Production Builds
        run: pnpm --recursive run build
